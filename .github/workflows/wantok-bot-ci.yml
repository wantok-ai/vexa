name: Wantok meeting bot CI

on:
  pull_request:
    paths:
      - 'core/meetings/contracts/invocation.v1/**'
      - 'core/meetings/modules/remote-browser/**'
      - 'core/meetings/modules/soniox/**'
      - 'core/meetings/services/bot/**'
      - '.github/workflows/wantok-bot-ci.yml'
      - '.github/workflows/wantok-bot-image.yml'
  push:
    branches: [main]
    paths:
      - 'core/meetings/contracts/invocation.v1/**'
      - 'core/meetings/modules/remote-browser/**'
      - 'core/meetings/modules/soniox/**'
      - 'core/meetings/services/bot/**'
      - '.github/workflows/wantok-bot-ci.yml'
      - '.github/workflows/wantok-bot-image.yml'

permissions:
  contents: read

concurrency:
  group: wantok-meeting-bot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vexa/transcribe-soniox test
      - run: pnpm --filter @vexa/bot test
      - run: pnpm --filter @vexa/bot build
      - uses: docker/setup-buildx-action@v3
      - name: Validate the meeting-bot Dockerfile and pinned base
        run: docker buildx build --call=check --file core/meetings/services/bot/Dockerfile .
