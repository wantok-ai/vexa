name: Publish Wantok meeting bot

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag, for example mvp-0.1.0
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  bot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate the immutable image tag
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/wantok-meeting-bot
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "${TAG}" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]; then
            echo "Invalid immutable image tag: ${TAG}"
            exit 1
          fi
          if docker buildx imagetools inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing image tag: ${IMAGE}:${TAG}"
            exit 1
          fi
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: core/meetings/services/bot/Dockerfile
          build-args: MEET_JOIN_BASE_IMAGE=vexaai/meet-join-env:dev@sha256:3da33828a910895dd7ea6dbbf20a18a77c47010a746fdfb3bf1f503a19cf100b
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/wantok-meeting-bot:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v2
        if: github.event.repository.visibility == 'public'
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/wantok-meeting-bot
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
