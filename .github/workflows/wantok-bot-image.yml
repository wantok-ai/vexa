name: Publish Wantok meeting bot

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag, for example mvp-0.1.0
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: core/meetings/services/bot/Dockerfile
          build-args: MEET_JOIN_BASE_IMAGE=vexaai/meet-join-env:dev@sha256:3da33828a910895dd7ea6dbbf20a18a77c47010a746fdfb3bf1f503a19cf100b
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/wantok-meeting-bot:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/wantok-meeting-bot
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
